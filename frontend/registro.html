<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Pibe Huertero</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <h2>Crear cuenta huertera</h2>
            <p>Sumate para acceder a los cursos y contenido exclusivo.</p>

            <form id="form-registro">
                <div class="input-group">
                    <label for="reg-nombre">Nombre</label>
                    <input type="text" id="reg-nombre" name="nombre" placeholder="Ej: Maxi" required>
                </div>
                <div class="input-group">
                    <label for="reg-apellido">Apellido</label>
                    <input type="text" id="reg-apellido" name="apellido" placeholder="Ej: Beltrán" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" name="email" placeholder="tu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <button type="submit" class="btn-primary">Registrarme</button>
                <div id="reg-mensaje" class="mensaje-alerta"></div>
            </form>

            <p class="auth-footer">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión acá</a></p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
