<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pibe Huertero</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <h2>¡Hola de nuevo!</h2>
            <p>Ingresá para ver tus cursos.</p>

            <form id="form-login">
                <div class="input-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" name="email" placeholder="tu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn-primary">Entrar a mi huerta</button>
                <div id="login-mensaje" class="mensaje-alerta"></div>
            </form>

            <p class="auth-footer">¿Todavía no sos parte? <a href="registro.html">Registrate gratis</a></p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
